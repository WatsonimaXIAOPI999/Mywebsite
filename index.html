<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poparcie Kandydatów</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        window.onload = function() {
            const ctx = document.getElementById('pollChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ["Rafał Trzaskowski", "Karol Nawrocki", "Sławomir Mentzen", "Szymon Hołownia", "Krzysztof Stanowski", "Magdalena Biejat", "Grzegorz Braun", "Adrian Zandberg", "Marek Jakubiak"],
                    datasets: [{
                        label: 'Poparcie (%)',
                        data: [32, 24, 15, -7, 5, 3, 3, 2, 1],
                        backgroundColor: 'rgba(54, 162, 235, 0.6)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }
    </script>
</head>
<body>
    <h1>Prawdziwe poparcie dla kandydatów, a nie jakieś lewackie. </h1>
    <canvas id="pollChart"></canvas>
</body>
</html>
